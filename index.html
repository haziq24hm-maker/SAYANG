<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terima Kemaafan Dari Abang?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Skrin Utama Proposal -->
  <div id="proposal-screen" class="container">
    <img id="gif-header" src="cute-cat.gif" alt="Cute GIF">
    <h1 id="question">Will you be my girlfriend? ❤️</h1>
    
    <div class="buttons">
      <button id="yes-btn" onclick="acceptProposal()">YES</button>
      <button id="no-btn" onclick="handleNoClick()">NO</button>
    </div>
  </div>

  <!-- Skrin Hadiah / Kejutan (Muncul selepas klik YES) -->
  <div id="gift-screen" class="container hidden">
    <h1>I knew you'd say yes 💕</h1>
    <img src="happy-cat.gif" alt="Happy GIF" class="gift-header-img">

    <div class="gifts-grid">
      <div class="gift-card" onclick="showSection('memories')">🎁<p>GIFT 1</p></div>
      <div class="gift-card" onclick="showSection('music')">🎁<p>GIFT 2</p></div>
      <div class="gift-card" onclick="showSection('letter')">🎁<p>GIFT 3</p></div>
    </div>
  </div>

  <!-- Kandungan Hadiah 1: Memori / Gambar -->
  <div id="memories" class="modal hidden">
    <h2>Captured Memories 📸</h2>
    <div class="photo-gallery">
      <img src="photo1.jpg" alt="Memory 1">
      <img src="photo2.jpg" alt="Memory 2">
    </div>
    <button onclick="closeModal('memories')">Go back</button>
  </div>

  <!-- Kandungan Hadiah 2: Lagu -->
  <div id="music" class="modal hidden">
    <h2>A song that reminds me of us 🎶</h2>
    <iframe width="300" height="180" src="https://www.youtube.com/embed/VIDEO_ID_HERE" frameborder="0" allowfullscreen></iframe>
    <br><br>
    <button onclick="closeModal('music')">Back</button>
  </div>

  <!-- Kandungan Hadiah 3: Surat Cinta -->
  <div id="letter" class="modal hidden">
    <div class="letter-card">
      <h2>Dear Love 💌</h2>
      <p>Mesej romantis anda boleh ditulis di sini...</p>
    </div>
    <button onclick="closeModal('letter')">Back</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
